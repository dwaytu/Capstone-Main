 stroke-width="2"/><text x="350" y="825.75" fill="#111827" font-family="Arial, sans-serif" font-size="30px" font-weight="400" text-anchor="middle" dominant-baseline="middle"><tspan x="350" dy="0">Review audit and forensic history:</tspan><tspan x="350" dy="34.5">actor, action, time and event</tspan></text><path d="M 350 913 L 570 965 L 350 1017 L 130 965 Z" fill="#FFF6D6" stroke="#FFF0B8" stroke-width="2"/><text x="350" y="947.75" fill="#111827" font-family="Arial, sans-serif" font-size="30px" font-weight="400" text-anchor="middle" dominant-baseline="middle"><tspan x="350" dy="0">Governance, account, security</tspan><tspan x="350" dy="34.5">or operational issue found?</tspan></text><rect x="825" y="922" width="430" height="92" rx="12" fill="#FAFAFA" stroke="#E2E8F0" stroke-width="2"/><text x="1040" y="950.75" fill="#111827" font-family="Arial, sans-serif" font-size="30px" font-weight="400" text-anchor="middle" dominant-baseline="middle"><tspan x="1040" dy="0">Perform authorized account</tspan><tspan x="1040" dy="34.5">or governance action</tspan></text><rect x="825" y="1042" width="430" height="92" rx="12" fill="#FAFAFA" stroke="#E2E8F0" stroke-width="2"/><text x="1040" y="1070.75" fill="#111827" font-family="Arial, sans-serif" font-size="30px" font-weight="400" text-anchor="middle" dominant-baseline="middle"><tspan x="1040" dy="0">Review resulting state and</tspan><tspan x="1040" dy="34.5">verify the action is recorded</tspan></text><rect x="100" y="1058" width="500" height="84" rx="12" fill="#FAFAFA" stroke="#E2E8F0" stroke-width="2"/><text x="350" y="1100" fill="#111827" font-family="Arial, sans-serif" font-size="30px" font-weight="400" text-anchor="middle" dominant-baseline="middle"><tspan x="350" dy="0">Review updated global status</tspan></text><path d="M 350 1172 L 570 1224 L 350 1276 L 130 1224 Z" fill="#FFF6D6" stroke="#FFF0B8" stroke-width="2"/><text x="350" y="1224" fill="#111827" font-family="Arial, sans-serif" font-size="30px" font-weight="400" text-anc