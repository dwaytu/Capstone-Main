an></text><rect x="100" y="830" width="500" height="92" rx="12" fill="#FAFAFA" stroke="#E2E8F0" stroke-width="2"/><text x="350" y="858.75" fill="#111827" font-family="Arial, sans-serif" font-size="30px" font-weight="400" text-anchor="middle" dominant-baseline="middle"><tspan x="350" dy="0">Monitor incidents, requests, support,</tspan><tspan x="350" dy="34.5">notifications, map and tracking</tspan></text><rect x="100" y="944" width="500" height="92" rx="12" fill="#FAFAFA" stroke="#E2E8F0" stroke-width="2"/><text x="350" y="972.75" fill="#111827" font-family="Arial, sans-serif" font-size="30px" font-weight="400" text-anchor="middle" dominant-baseline="middle"><tspan x="350" dy="0">Manage permitted Guard accounts</tspan><tspan x="350" dy="34.5">and operational resources</tspan></text><rect x="100" y="1058" width="500" height="92" rx="12" fill="#FAFAFA" stroke="#E2E8F0" stroke-width="2"/><text x="350" y="1086.75" fill="#111827" font-family="Arial, sans-serif" font-size="30px" font-weight="400" text-anchor="middle" dominant-baseline="middle"><tspan x="350" dy="0">Review Guard performance,</tspan><tspan x="350" dy="34.5">attendance and replacement outcomes</tspan></text><path d="M 350 1174 L 570 1226 L 350 1278 L 130 1226 Z" fill="#FFF6D6" stroke="#FFF0B8" stroke-width="2"/><text x="350" y="1208.75" fill="#111827" font-family="Arial, sans-serif" font-size="30px" font-weight="400" text-anchor="middle" dominant-baseline="middle"><tspan x="350" dy="0">Issue requires</tspan><tspan x="350" dy="34.5">action?</tspan></text><rect x="825" y="1182" width="430" height="92" rx="12" fill="#FAFAFA" stroke="#E2E8F0" stroke-width="2"/><text x="1040" y="1210.75" fill="#111827" font-family="Arial, sans-serif" font-size="30px" font-weight="400" text-anchor="middle" dominant-baseline="middle"><tspan x="1040" dy="0">Coordinate corrective action</tspan><tspan x="1040" dy="34.5">or escalation</tspan></text><rect x="825" y="1302" width="430" height="92" rx="12" fill="#FAFAFA" stroke="#E2E8F0" st